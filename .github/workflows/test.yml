name: VIDEO AI STUDIO — tests de branche

on:
  push:
    branches:
      - test/video-engine-alternative
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-app:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe JavaScript
        run: node --check app.js
      - name: Vérifier les éléments et paramètres de l'application
        run: node scripts/check-app.mjs
